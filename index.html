<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>필지 3D 뷰어</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<!-- 키는 소스에 없음: 로컬은 .env로 만든 config.js, Vercel은 /api/config 가 채워줌 -->
<script src="config.js"></script>
<style>
  :root{
    --bg:#ffffff; --fg:#1b1d22; --muted:#6b7280; --panel:rgba(255,255,255,.96); --line:#e3e5ea; --soft:#f3f4f7;
    --accent:#1f3a93; --accent-soft:#e8edfa; --warn:#c2410c; --ok:#15803d; --shadow:0 6px 24px rgba(15,23,42,.14);
  }
  :root[data-theme="dark"]{ --bg:#14161a; --fg:#e8e9ec; --muted:#9aa0aa; --panel:rgba(28,31,37,.96); --line:#30343c; --soft:#22262d; --accent:#8fa8ff; --accent-soft:#1f2a4a; }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#14161a; --fg:#e8e9ec; --muted:#9aa0aa; --panel:rgba(28,31,37,.96); --line:#30343c; --soft:#22262d; --accent:#8fa8ff; --accent-soft:#1f2a4a; } }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"Pretendard","Segoe UI","Malgun Gothic",sans-serif;color:var(--fg);background:var(--bg);font-size:13px}
  #map{position:absolute;inset:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
  button{font:inherit;color:inherit}
  .btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:12px}
  .btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .muted{color:var(--muted)}
  h2{font-size:12px;letter-spacing:.04em;color:var(--muted);margin:0 0 6px;font-weight:600}

  /* 상단 바 */
  #top{position:absolute;top:12px;left:12px;z-index:5;width:300px;padding:10px 12px}
  #top .t{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #top h1{font-size:15px;margin:0}
  #top .sub{font-size:11px;color:var(--muted);margin-top:2px}
  #search{display:flex;gap:6px;margin-top:8px}
  #search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg);color:var(--fg);font:inherit}
  #ctrlBody{margin-top:8px;max-height:calc(100vh - 150px);overflow:auto}
  .sec{border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
  .row{display:flex;align-items:center;gap:7px;margin:4px 0;cursor:pointer}
  .row input{margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  select{width:100%;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit}
  .legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;font-size:11.5px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.2)}
  .grad{height:8px;border-radius:4px;margin-top:6px}
  .gl{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
  #sunBox input[type=range]{width:100%}
  #sunInfo{font-size:11.5px;margin-top:4px}

  /* 정보 패널 */
  #info{position:absolute;top:12px;right:56px;bottom:12px;z-index:5;width:380px;display:flex;flex-direction:column;overflow:hidden}
  #info .head{padding:12px 14px 8px;border-bottom:1px solid var(--line)}
  #info .head .addr{font-size:15px;font-weight:700;line-height:1.35}
  #info .head .meta{font-size:11px;color:var(--muted);margin-top:2px}
  #info .hx{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  #tabs{display:flex;gap:2px;overflow-x:auto;padding:0 8px;border-bottom:1px solid var(--line);scrollbar-width:none}
  #tabs button{border:0;background:none;padding:9px 9px;cursor:pointer;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent;font-size:12.5px}
  #tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
  #pane{flex:1;overflow:auto;padding:12px 14px 20px}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:5px 10px;font-size:12.5px}
  .kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
  .stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stat div{background:var(--soft);border-radius:10px;padding:8px}
  .stat b{display:block;font-size:16px;margin-top:2px}
  .stat span{font-size:11px;color:var(--muted)}
  .hl{background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:6px;padding:8px 10px;margin:8px 0 12px}
  .hl b{font-size:15px}
  .gauge{margin:8px 0}
  .gauge .gt{display:flex;justify-content:space-between;font-size:12px}
  .gauge .bar{position:relative;height:9px;background:var(--soft);border-radius:5px;margin-top:4px;overflow:hidden}
  .gauge .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
  .gauge .bar i.over{background:var(--warn)}
  .hbar{display:grid;grid-template-columns:86px 1fr 34px;align-items:center;gap:6px;margin:4px 0;font-size:12px}
  .hbar .b{height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
  .hbar .b i{display:block;height:100%;background:var(--accent);border-radius:4px}
  table.t{width:100%;border-collapse:collapse;font-size:12px}
  table.t th,table.t td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  table.t th{color:var(--muted);font-weight:500}
  .floors{display:flex;flex-direction:column-reverse;gap:2px;margin:6px 0 12px}
  .floors div{height:16px;border-radius:3px;background:var(--accent-soft);border:1px solid var(--accent);font-size:10.5px;line-height:14px;padding:0 6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .floors div.ug{background:var(--soft);border-color:var(--muted);color:var(--muted)}
  .strip{display:flex;height:18px;border-radius:4px;overflow:hidden;margin:6px 0 2px}
  .strip i{flex:1}
  .note{font-size:11px;color:var(--muted);margin-top:8px;line-height:1.5}
  .bldcard{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
  .badge{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:10px;background:var(--soft);color:var(--muted);margin-left:4px}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
  @keyframes sp{to{transform:rotate(360deg)}}
  #toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:9;background:#111827;color:#fff;padding:7px 12px;border-radius:8px;font-size:12px;display:none;max-width:86vw}
  .maplibregl-popup-content{font-size:12.5px;line-height:1.5;color:#1b1d22;border-radius:10px;padding:10px 12px}
  .maplibregl-popup-content .pbld{margin-top:5px;padding:5px 7px;background:#e8edfa;border-left:3px solid #1f3a93;border-radius:4px}

  /* 모바일 */
  @media (max-width:760px){
    #top{left:8px;right:8px;width:auto;top:8px;padding:9px 10px}
    #ctrlBody{max-height:46vh}
    #top.folded #ctrlBody{display:none}
    #info{left:0;right:0;top:auto;bottom:0;width:auto;height:54vh;border-radius:14px 14px 0 0}
    #info.min{height:96px}
    .maplibregl-ctrl-top-right{top:auto!important;bottom:calc(54vh + 8px)}
    body.infomin .maplibregl-ctrl-top-right{bottom:104px}
    body.noinfo .maplibregl-ctrl-top-right{bottom:20px}
  }
  @media (min-width:761px){ #fold{display:none} }
  #info.hide{display:none}
</style>
</head>
<body class="noinfo">
<div id="map"></div>

<section id="top" class="card">
  <div class="t">
    <div>
      <h1>필지 3D 뷰어</h1>
      <div class="sub">VWorld · 건축물대장(data.go.kr) · LH 노후필지 <span id="n"></span></div>
    </div>
    <button id="fold" class="btn" type="button">설정</button>
  </div>
  <form id="search" autocomplete="off">
    <input id="q" placeholder="주소 검색 (예: 신림동 1573-28)">
    <button class="btn" type="submit">검색</button>
  </form>
  <div id="ctrlBody">
    <div class="sec">
      <h2>보기</h2>
      <div class="chips">
        <button class="btn" id="b3d" type="button">3D 건물</button>
        <button class="btn" id="bShadow" type="button">그림자</button>
        <button class="btn" id="bMass" type="button">법정 최대 볼륨</button>
      </div>
      <div id="sunBox" style="display:none;margin-top:8px">
        <div class="chips" id="days">
          <button class="btn on" data-d="12-22" type="button">동지</button>
          <button class="btn" data-d="03-21" type="button">춘·추분</button>
          <button class="btn" data-d="06-21" type="button">하지</button>
          <button class="btn" data-d="today" type="button">오늘</button>
        </div>
        <input id="hour" type="range" min="7" max="18" step="0.25" value="12">
        <div id="sunInfo" class="muted"></div>
      </div>
    </div>
    <div class="sec">
      <h2>배경지도</h2>
      <select id="base">
        <option value="Base">VWorld 일반</option>
        <option value="gray">VWorld 회색</option>
        <option value="midnight">VWorld 야간</option>
        <option value="Satellite">VWorld 위성</option>
      </select>
      <label class="row" style="margin-top:6px"><input type="checkbox" id="lyr-cad"> 지적도(연속지적)</label>
      <label class="row"><input type="checkbox" id="lyr-zone"> 용도지역</label>
    </div>
    <div class="sec">
      <h2>LH 노후필지 표시</h2>
      <select id="colorBy">
        <option value="osc">OSC 공법유형</option>
        <option value="age">노후년수</option>
        <option value="far">용적률(현황)</option>
        <option value="units">임대세대수</option>
      </select>
      <div id="legend"></div>
      <select id="gu" style="margin-top:8px"><option value="">전체 자치구</option></select>
      <label class="row" style="margin-top:6px"><input type="checkbox" id="lyr-pts" checked> 필지 점 표시</label>
    </div>
    <div class="note">지도 아무 곳이나 클릭하면 그 필지를 조회합니다. 3D·그림자는 확대(줌 16 이상) 시 주변 건물을 불러옵니다.</div>
  </div>
</section>

<aside id="info" class="card hide">
  <div class="head">
    <div class="hx">
      <div><div class="addr" id="iAddr"></div><div class="meta" id="iMeta"></div></div>
      <div style="display:flex;gap:4px">
        <button class="btn" id="iMin" type="button" title="접기">▾</button>
        <button class="btn" id="iClose" type="button" title="닫기">✕</button>
      </div>
    </div>
  </div>
  <nav id="tabs"></nav>
  <div id="pane"></div>
</aside>
<div id="toast"></div>

<script>
// ═══ 설정 · 키 (소스코드에 직접 쓰지 않음: .env → config.js / Vercel 환경변수) ═══
const CFG  = window.APP_CONFIG || {};
const VKEY = CFG.VWORLD_KEY || "";
const VDOMAIN = location.hostname || "localhost";      // VWorld 키 등록 URL과 비교됨
const IS_LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (n, d=0) => (n==null || n==='' || isNaN(+n)) ? '–' : (+n).toLocaleString('ko-KR',{maximumFractionDigits:d});
const toast = (m, ms=2600) => { const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(()=>t.style.display='none', ms); };
if(!VKEY) toast('VWorld 키 없음 — 로컬: node tools/make-config.mjs / Vercel: VWORLD_KEY 환경변수', 8000);

// ═══ API 래퍼 ═══
// VWorld 데이터 API는 배포 환경에서 CORS로 막히므로 /api/vworld 프록시 경유 (로컬은 직접)
async function vw(path, params){
  const qs = new URLSearchParams({...params, domain:VDOMAIN});
  const url = IS_LOCAL ? `https://api.vworld.kr/${path}?${qs}&key=${VKEY}` : `api/vworld?_p=${encodeURIComponent(path)}&${qs}`;
  const r = await fetch(url); return r.json();
}
const vwData = (data, extra) => vw('req/data', {service:'data', request:'GetFeature', data, format:'json', crs:'EPSG:4326', ...extra});

// data.go.kr 건축HUB 건축물대장 — PNU 19자리 = 시군구5+법정동5+대지구분1(1일반/2산)+본번4+부번4
async function bld(op, pnu){
  const q = new URLSearchParams({ sigunguCd:pnu.slice(0,5), bjdongCd:pnu.slice(5,10), platGbCd:pnu[10]==='2'?'1':'0', bun:pnu.slice(11,15), ji:pnu.slice(15,19) });
  const url = CFG.DATA_GO_KR_KEY
    ? `https://apis.data.go.kr/1613000/BldRgstHubService/${op}?serviceKey=${encodeURIComponent(CFG.DATA_GO_KR_KEY)}&_type=json&numOfRows=100&pageNo=1&${q}`
    : `api/bld?op=${op}&${q}`;
  try{
    const txt = await (await fetch(url)).text();
    let j; try{ j=JSON.parse(txt); }catch(e){ j={error:txt.slice(0,200)}; }
    console.log(`[data.go.kr ${op}]`, pnu, j);   // ← F12 콘솔에서 응답 확인
    let it = j?.response?.body?.items?.item;
    if(!it) return [];
    return Array.isArray(it) ? it : [it];
  }catch(e){ console.warn(op, e); return []; }
}

// ═══ 지도 ═══
const BASES = ['Base','gray','midnight','Satellite'];
const wmts = t => `https://api.vworld.kr/req/wmts/1.0.0/${VKEY}/${t}/{z}/{y}/{x}.${t==='Satellite'?'jpeg':'png'}`;
const wms = layer => `https://api.vworld.kr/req/wms?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=${layer}&STYLES=${layer}`
  + `&CRS=EPSG:3857&BBOX={bbox-epsg-3857}&WIDTH=256&HEIGHT=256&FORMAT=image/png&TRANSPARENT=true&KEY=${VKEY}&DOMAIN=${encodeURIComponent(VDOMAIN)}`;
const style = { version:8, sources:{}, layers:[] };
[...BASES,'Hybrid'].forEach(t=>{
  style.sources['b-'+t] = {type:'raster', tiles:[wmts(t)], tileSize:256, maxzoom:19, attribution:'© VWorld'};
  style.layers.push({id:'b-'+t, type:'raster', source:'b-'+t, layout:{visibility: t==='Base'?'visible':'none'}});
});
style.sources['ov-cad']  = {type:'raster', tiles:[wms('lp_pa_cbnd_bubun')], tileSize:256};
style.sources['ov-zone'] = {type:'raster', tiles:[wms('lt_c_uq111')], tileSize:256};
style.layers.push({id:'ov-zone', type:'raster', source:'ov-zone', layout:{visibility:'none'}, paint:{'raster-opacity':.45}});
style.layers.push({id:'ov-cad',  type:'raster', source:'ov-cad',  layout:{visibility:'none'}, paint:{'raster-opacity':.85}});

const map = new maplibregl.Map({ container:'map', style, center:[126.98,37.54], zoom:10.5, maxPitch:70, attributionControl:{compact:true} });
window.map = map;
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}), 'top-right');
map.addControl(new maplibregl.GeolocateControl({positionOptions:{enableHighAccuracy:true}}), 'top-right');
map.addControl(new maplibregl.ScaleControl({maxWidth:100, unit:'metric'}), 'bottom-left');

const EMPTY = {type:'FeatureCollection', features:[]};
let DATA = null;          // LH 노후필지
let SEL = null;           // 선택 필지 상태
const ui = { b3d:false, shadow:false, mass:false, day:'12-22', hour:12, colorBy:'osc', gu:'' };

let readyResolve; const mapReady = new Promise(r=>readyResolve=r);
map.on('load', () => {
  map.addSource('shadow', {type:'geojson', data:EMPTY});
  map.addSource('parcel', {type:'geojson', data:EMPTY});
  map.addSource('bldg',   {type:'geojson', data:EMPTY});
  map.addSource('selbldg',{type:'geojson', data:EMPTY});
  map.addSource('mass',   {type:'geojson', data:EMPTY});
  map.addSource('pts',    {type:'geojson', data:EMPTY});

  map.addLayer({id:'shadow', type:'fill', source:'shadow', layout:{visibility:'none'}, paint:{'fill-color':'#0b1020','fill-opacity':.38}});
  map.addLayer({id:'parcel-fill', type:'fill', source:'parcel', paint:{'fill-color':'#1f3a93','fill-opacity':.16}});
  map.addLayer({id:'parcel-line', type:'line', source:'parcel', paint:{'line-color':'#1f3a93','line-width':2.6}});
  map.addLayer({id:'bldg-3d', type:'fill-extrusion', source:'bldg', layout:{visibility:'none'}, paint:{
    'fill-extrusion-color':['interpolate',['linear'],['get','h'], 0,'#e6e2d8', 10,'#d6cdb8', 25,'#b9c3d6', 60,'#8496c0', 120,'#4c5f9c'],
    'fill-extrusion-height':['get','h'], 'fill-extrusion-base':0, 'fill-extrusion-opacity':.92 }});
  map.addLayer({id:'selbldg-3d', type:'fill-extrusion', source:'selbldg', layout:{visibility:'none'}, paint:{
    'fill-extrusion-color':'#f59e0b', 'fill-extrusion-height':['get','h'], 'fill-extrusion-opacity':.95 }});
  map.addLayer({id:'mass-3d', type:'fill-extrusion', source:'mass', layout:{visibility:'none'}, paint:{
    'fill-extrusion-color':'#ef4444', 'fill-extrusion-height':['get','h'], 'fill-extrusion-opacity':.33 }});
  map.addLayer({id:'pts', type:'circle', source:'pts', paint:{
    'circle-radius':['interpolate',['linear'],['zoom'],9,3,13,5.5,16,8],
    'circle-color':colorExpr('osc'), 'circle-stroke-width':1.2, 'circle-stroke-color':'#fff', 'circle-opacity':.92 }});
  if(DATA) initParcels();
  bindMapEvents();
  readyResolve();
});

// ═══ LH 노후필지 레이어 ═══
const OSC = {'소형':'#2e7d32','중형':'#f9a825','대형':'#c62828','':'#9ca3af'};
const RAMPS = {
  age:  {k:'노후년수', stops:[15,'#fde68a',25,'#f97316',35,'#b91c1c'], unit:'년', label:'노후년수'},
  far:  {k:'용적률',   stops:[50,'#bfdbfe',150,'#3b82f6',250,'#1e3a8a'], unit:'%', label:'용적률(현황)'},
  units:{k:'임대세대수',stops:[2,'#d9f99d',10,'#22c55e',20,'#14532d'], unit:'세대', label:'임대세대수'},
};
function colorExpr(mode){
  if(mode==='osc') return ['match',['get','OSC공법'],'소형',OSC['소형'],'중형',OSC['중형'],'대형',OSC['대형'],OSC['']];
  const r=RAMPS[mode];
  return ['case',['has',r.k],['interpolate',['linear'],['get',r.k],...r.stops],'#c7c9ce'];
}
function renderLegend(){
  const el=$('#legend'), m=ui.colorBy;
  if(m==='osc'){
    el.innerHTML = '<div class="legend">'+Object.entries({'소형패널':'소형','중형패널':'중형','대형패널':'대형','미배정':''})
      .map(([l,k])=>`<span><i style="background:${OSC[k]}"></i>${l}</span>`).join('')+'</div>';
  }else{
    const r=RAMPS[m], s=r.stops;
    el.innerHTML = `<div class="grad" style="background:linear-gradient(90deg,${s[1]},${s[3]},${s[5]})"></div>`
      + `<div class="gl"><span>${s[0]}${r.unit}</span><span>${s[2]}</span><span>${s[4]}${r.unit}+</span></div>`
      + `<div class="legend"><span><i style="background:#c7c9ce"></i>값 없음</span></div>`;
  }
}
function applyFilter(){
  if(!map.getLayer('pts')) return;
  map.setFilter('pts', ui.gu ? ['==',['get','gu'],ui.gu] : null);
  map.setPaintProperty('pts','circle-color', colorExpr(ui.colorBy));
  renderLegend();
  if(!SEL) renderDashboard();
}
function initParcels(){
  map.getSource('pts').setData(DATA);
  const xs=DATA.features.map(f=>f.geometry.coordinates[0]), ys=DATA.features.map(f=>f.geometry.coordinates[1]);
  const mobile = innerWidth<=760;

async function selectAt({lngLat, feat}){
  const seq=++selSeq;
  await mapReady;
  const research = feat ? feat.properties : null;
  let ll = lngLat ? [lngLat.lng, lngLat.lat] : feat.geometry.coordinates;
  let pnu=null, poly=null, addr=research ? '서울특별시 '+research.addr : '';
  SEL = {loading:true, research, addr, pnu:null};
  showInfo(); curTab=0; renderSel();
  popup?.remove();
  popup = new maplibregl.Popup({maxWidth:'260px', anchor: innerWidth<=760?'top':undefined, offset:8})
    .setLngLat(ll).setHTML(`<b>${esc(addr||'필지 조회 중')}</b><div class="pbld"><span class="spin"></span> 조회 중…</div>`).addTo(map);
  try{
    if(research){   // LH 필지: 점 좌표가 동 단위 근사값 → 주소로 정확한 PNU
      const s = await vw('req/search', {service:'search',request:'search',version:'2.0',crs:'EPSG:4326',size:1,page:1,type:'address',category:'parcel',format:'json',errorformat:'json',query:addr});
      const it=s?.response?.result?.items?.[0];
      if(it){ pnu=it.id; ll=[+it.point.x,+it.point.y]; }
    }
    const r = await vwData('LP_PA_CBND_BUBUN', pnu ? {attrFilter:`pnu:=:${pnu}`, geometry:true, size:1} : {geomFilter:`POINT(${ll[0]} ${ll[1]})`, geometry:true, size:1});
    const f = r?.response?.result?.featureCollection?.features?.[0];
    if(f){ poly=f; pnu=pnu||f.properties.pnu; addr = addr || f.properties.addr; SEL.jiga=f.properties.jiga; }
    if(r?.response?.status==='ERROR') toast('VWorld: '+(r.response.error?.text||'오류'));
  }catch(e){ console.warn('필지 조회 실패', e); }
  if(seq!==selSeq) return;
  if(!pnu){ SEL.loading=false; SEL.error='이 위치의 필지를 찾지 못했습니다.'; renderSel(); popup.setHTML('필지 없음'); return; }

  Object.assign(SEL, {pnu, addr, poly});

  if(poly){
    const b=new maplibregl.LngLatBounds(); ringsOf(poly.geometry).flat().forEach(c=>b.extend(c));
    SEL.bounds=b; SEL.center=centroid(ringsOf(poly.geometry)[0]);
    popup.setLngLat(SEL.center);
    map.fitBounds(b,{padding:fitPad(), maxZoom: (ui.b3d||ui.shadow) ? 17 : 18, duration:600});
  }
  renderSel();

  // 병렬 조회

      const f=j?.landCharacteristicss?.field?.[0]; if(f) return f; } return null; })();
  const [land, titles, floors, jijigu, recap, hsprc] = await Promise.all([landP, bld('getBrTitleInfo',pnu), bld('getBrFlrOulnInfo',pnu), bld('getBrJijiguInfo',pnu), bld('getBrRecapTitleInfo',pnu), bld('getBrHsprcInfo',pnu)]);
  if(seq!==selSeq) return;
  Object.assign(SEL, {land, titles, floors, jijigu, recap, hsprc, loading:false});
  // 팝업: data.go.kr 한 겹 (연면적·층수 한 줄)
  const m = mainBld(titles);
  popup.setHTML(`<b>${esc(addr)}</b>` + (m
    ? `<div class="pbld">연면적 <b>${fmt(m.totArea,2)}㎡</b> · 지상 <b>${m.grndFlrCnt}층</b>${+m.ugrndFlrCnt?` / 지하 ${m.ugrndFlrCnt}층`:''}<br><span style="color:#6b7280;font-size:11px">건축물대장 표제부 · ${esc(m.mainPurpsCdNm)} · data.go.kr</span></div>`
    : `<div class="pbld">건축물대장: 등록된 건축물 없음</div>`));
  renderSel();
  updateMass();
  if(poly) await ensureBuildings(paddedBbox(SEL.bounds, 180));
  if(seq!==selSeq) return;
  markSelBuildings(); updateShadows(); if(TABS[curTab]?.[0]==='일조') renderSel();
}

// ═══ 3D 건물 (VWorld LT_C_BLDGINFO: 높이·층수·연면적) ═══
const BLD = new Map(); let loadedBoxes=[];
const ringsOf = g => g.type==='Polygon' ? g.coordinates : g.type==='MultiPolygon' ? g.coordinates.flat() : [];
function centroid(r){ let x=0,y=0; const n=r.length-1||1; for(let i=0;i<n;i++){x+=r[i][0];y+=r[i][1];} return [x/n,y/n]; }
function paddedBbox(b, m){ const c=b.getCenter(), dx=m/(111320*Math.cos(c.lat*Math.PI/180)), dy=m/110540; return [b.getWest()-dx,b.getSouth()-dy,b.getEast()+dx,b.getNorth()+dy]; }
const inside = (b, a) => a[0]>=b[0] && a[1]>=b[1] && a[2]<=b[2] && a[3]<=b[3];
let bldBusy=false;
async function ensureBuildings(box){
  if(loadedBoxes.some(b=>inside(b,box)) || bldBusy) return;
  bldBusy=true;
  try{
    for(let page=1; page<=4; page++){
      const r = await vwData('LT_C_BLDGINFO', {geomFilter:`BOX(${box.map(v=>v.toFixed(6)).join(',')})`, geometry:true, size:1000, page});
      const fc=r?.response?.result?.featureCollection; if(!fc) break;
      fc.features.forEach(f=>{ const p=f.properties, h=+p.height>0 ? +p.height : Math.max(+p.grnd_flr||1,1)*3.1;
        BLD.set(f.id, {type:'Feature', id:f.id, geometry:f.geometry, properties:{h, fl:+p.grnd_flr||0, area:+p.totalarea||0, apr:p.useapr_day, nm:p.bld_nm}}); });
      if(+r.response.page.current >= +r.response.page.total) break;
    }
    loadedBoxes.push(box);
    map.getSource('bldg')?.setData({type:'FeatureCollection', features:[...BLD.values()]});
  }catch(e){ console.warn('건물 로드 실패', e); }
  bldBusy=false;
}
function pip(pt, ring){ let c=false; for(let i=0,j=ring.length-1;i<ring.length;j=i++){ const [xi,yi]=ring[i],[xj,yj]=ring[j]; if(((yi>pt[1])!==(yj>pt[1])) && pt[0] < (xj-xi)*(pt[1]-yi)/(yj-yi)+xi) c=!c; } return c; }
function inParcel(f){ if(!SEL?.poly) return false; const rings=ringsOf(SEL.poly.geometry); return ringsOf(f.geometry).some(r=>rings.some(pr=>pip(centroid(r),pr))); }
function markSelBuildings(){
  const fs=[...BLD.values()].filter(inParcel); SEL && (SEL.own=new Set(fs.map(f=>f.id)));
  map.getSource('selbldg')?.setData({type:'FeatureCollection', features:fs});
}
function viewBuildings(){
  if(!(ui.b3d||ui.shadow) || map.getZoom()<15.5) return;
  const b=map.getBounds(); ensureBuildings(paddedBbox(b, 60)).then(()=>{ markSelBuildings(); updateShadows(); });
}

// ═══ 법정 최대 볼륨 (건폐율로 줄인 필지 × 용적률/건폐율 층수) ═══
function updateMass(){
  const src=map.getSource('mass'); if(!src) return;
  const lg=legalOf(SEL?.land?.prposArea1Nm);
  if(!ui.mass || !SEL?.poly || !lg){ src.setData(EMPTY); if(ui.mass&&SEL&&!lg) toast('용도지역 상한을 알 수 없어 볼륨을 만들 수 없습니다'); return; }
  const k=Math.sqrt(lg[0]/100), floors=Math.floor(lg[1]/lg[0]), h=floors*3.1;
  const scaled = ringsOf(SEL.poly.geometry).map(r=>{ const c=centroid(r); return r.map(([x,y])=>[c[0]+(x-c[0])*k, c[1]+(y-c[1])*k]); });
  src.setData({type:'FeatureCollection', features:[{type:'Feature', properties:{h}, geometry:{type:'Polygon', coordinates:[scaled[0]]}}]});
  toast(`법정 최대: 건폐율 ${lg[0]}% · 용적률 ${lg[1]}% → 약 ${floors}층 (${h.toFixed(0)}m)`);
}

// ═══ 태양 위치 · 그림자 (SunCalc 공식) ═══
const RAD=Math.PI/180;
function sunPos(date, lat, lng){
  const d = date.valueOf()/864e5 - 0.5 + 2440588 - 2451545;
  const M=RAD*(357.5291+0.98560028*d), C=RAD*(1.9148*Math.sin(M)+0.02*Math.sin(2*M)+0.0003*Math.sin(3*M));
  const L=M+C+RAD*102.9372+Math.PI, e=RAD*23.4397;
  const dec=Math.asin(Math.sin(e)*Math.sin(L)), ra=Math.atan2(Math.sin(L)*Math.cos(e), Math.cos(L));
  const H=RAD*(280.16+360.9856235*d)-RAD*-lng - ra, phi=RAD*lat;
  return { az:Math.atan2(Math.sin(H), Math.cos(H)*Math.sin(phi)-Math.tan(dec)*Math.cos(phi)),   // 남쪽 기준, 서쪽(+)
           alt:Math.asin(Math.sin(phi)*Math.sin(dec)+Math.cos(phi)*Math.cos(dec)*Math.cos(H)) };
}
function kst(dayStr, hour){
  const y=new Date().getFullYear(); let m,d;
  if(dayStr==='today'){ const t=new Date(Date.now()+9*3600e3); m=t.getUTCMonth()+1; d=t.getUTCDate(); } else [m,d]=dayStr.split('-').map(Number);
  return new Date(Date.UTC(y,m-1,d, Math.floor(hour)-9, Math.round((hour%1)*60)));
}
function hull(pts){
  pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); if(pts.length<3) return pts;
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[],up=[];
  for(const p of pts){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for(const p of pts.slice().reverse()){ while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  up.pop(); lo.pop(); const h=lo.concat(up); h.push(h[0]); return h;
}
function shadowOf(f, sun, lat){
  if(sun.alt < 2*RAD) return null;
  const L=Math.min(f.properties.h/Math.tan(sun.alt), 400);
  const dx=Math.sin(sun.az)*L/(111320*Math.cos(lat*RAD)), dy=Math.cos(sun.az)*L/110540;
  return ringsOf(f.geometry).map(r=>hull(r.concat(r.map(([x,y])=>[x+dx,y+dy]))));
}
function updateShadows(){
  const src=map.getSource('shadow'); if(!src) return;
  const c=map.getCenter(), sun=sunPos(kst(ui.day, ui.hour), c.lat, c.lng);
  const azDeg=(sun.az/RAD+180+360)%360;
  $('#sunInfo').textContent = `${String(Math.floor(ui.hour)).padStart(2,'0')}:${String(Math.round(ui.hour%1*60)).padStart(2,'0')} · 태양고도 ${(sun.alt/RAD).toFixed(1)}° · 방위 ${azDeg.toFixed(0)}° ${sun.alt<0?'(해 짐)':''}`;
  if(!ui.shadow){ src.setData(EMPTY); return; }
  const feats=[]; for(const f of BLD.values()){ const s=shadowOf(f,sun,c.lat); if(s) feats.push({type:'Feature',properties:{},geometry:{type:'MultiPolygon',coordinates:s.map(r=>[r])}}); }
  src.setData({type:'FeatureCollection', features:feats});
}
// 선택 필지 일조 분석: 필지 중심점이 주변 건물 그림자에 덮이는지 10분 간격 검사
function sunAnalysis(dayStr){
  if(!SEL?.center) return null;
  const [lng,lat]=SEL.center, own=SEL.own||new Set(), kx=111320*Math.cos(lat*RAD);
  const near=[...BLD.values()].filter(f=>{ if(own.has(f.id)) return false; const c=centroid(ringsOf(f.geometry)[0]||[[0,0],[0,0]]); return Math.hypot((c[0]-lng)*kx,(c[1]-lat)*110540) < 250; });
  const slots=[];
  for(let h=8; h<16; h+=1/6){
    const sun=sunPos(kst(dayStr,h), lat, lng);
    let shaded = sun.alt<=0;
    if(!shaded) for(const f of near){ const s=shadowOf(f,sun,lat); if(s && s.some(r=>pip([lng,lat],r))){ shaded=true; break; } }
    slots.push({h, shaded});
  }
  const lit=slots.filter(s=>!s.shaded).length/6;
  let best=0,run=0; slots.forEach(s=>{ if(s.h>=9&&s.h<15){ run = s.shaded?0:run+1/6; best=Math.max(best,run);} });
  return {slots, lit, cont:best, n:near.length};
}
function tabSun(){
  if(!SEL?.center) return wait()||'<p class="muted">필지 경계가 없어 분석할 수 없습니다.</p>';
  if(!BLD.size) return '<p class="muted"><span class="spin"></span> 주변 건물 불러오는 중…</p>';
  const days=[['동지','12-22'],['춘·추분','03-21'],['하지','06-21']];
  const rs=days.map(([n,d])=>[n,sunAnalysis(d)]);
  const w=rs[0][1];
  const verdict = w.cont>=2 ? `<b style="color:var(--ok)">충족</b>` : (w.lit>=4 ? `<b style="color:var(--ok)">충족</b> (총 4시간 기준)` : `<b style="color:var(--warn)">미달 가능</b>`);
  return `<div class="hl">동지 일조: 연속 <b>${w.cont.toFixed(1)}시간</b>(09–15시) · 총 <b>${w.lit.toFixed(1)}시간</b>(08–16시) → ${verdict}</div>
    ${rs.map(([n,r])=>`<div style="margin:10px 0 2px;display:flex;justify-content:space-between"><b>${n}</b><span class="muted">일조 ${r.lit.toFixed(1)}h · 연속 ${r.cont.toFixed(1)}h</span></div>
      <div class="strip">${r.slots.map(s=>`<i style="background:${s.shaded?'#334155':'#fbbf24'}" title="${Math.floor(s.h)}:${String(Math.round(s.h%1*60)).padStart(2,'0')}"></i>`).join('')}</div>
      <div class="gl"><span>08시</span><span>10</span><span>12</span><span>14</span><span>16시</span></div>`).join('')}
    <div class="chips" style="margin-top:12px"><button class="btn" data-act="shadow" type="button">지도에 그림자 켜기</button></div>
    <div class="note">노란색=햇빛, 회색=주변 건물 그림자. 필지 중심점 기준, 주변 건물 ${w.n}동(VWorld 건물정보 높이)으로 계산한 근사치입니다.
    건축법 시행령 일조 기준(동지 09–15시 연속 2시간 또는 08–16시 총 4시간)과 비교용이며, 지형·수목·담장은 반영하지 않습니다.</div>`;
}

// ═══ 컨트롤 바인딩 ═══
$('#fold').onclick=()=>$('#top').classList.toggle('folded');
if(innerWidth<=760) $('#top').classList.add('folded');
$('#base').onchange=e=>{ BASES.forEach(t=>map.setLayoutProperty('b-'+t,'visibility',t===e.target.value?'visible':'none')); map.setLayoutProperty('b-Hybrid','visibility',e.target.value==='Satellite'?'visible':'none'); };
$('#lyr-cad').onchange=e=>map.setLayoutProperty('ov-cad','visibility',e.target.checked?'visible':'none');
$('#lyr-zone').onchange=e=>map.setLayoutProperty('ov-zone','visibility',e.target.checked?'visible':'none');
$('#lyr-pts').onchange=e=>map.setLayoutProperty('pts','visibility',e.target.checked?'visible':'none');

function need3dZoom(){ if(map.getZoom()<16) map.easeTo({zoom:16.5, center: SEL?.center || map.getCenter()}); }
$('#b3d').onclick=e=>{
  ui.b3d=!ui.b3d; e.target.classList.toggle('on',ui.b3d);
  ['bldg-3d','selbldg-3d'].forEach(l=>map.setLayoutProperty(l,'visibility',ui.b3d?'visible':'none'));

  if(ui.b3d){ need3dZoom(); viewBuildings(); }
};
$('#bShadow').onclick=e=>{
  ui.shadow=!ui.shadow; e.target.classList.toggle('on',ui.shadow);
  $('#sunBox').style.display=ui.shadow?'block':'none';
  map.setLayoutProperty('shadow','visibility',ui.shadow?'visible':'none');

};
$('#bMass').onclick=e=>{
  if(!SEL?.poly && !ui.mass){ toast('먼저 필지를 선택하세요'); return; }
  ui.mass=!ui.mass; e.target.classList.toggle('on',ui.mass);
  map.setLayoutProperty('mass-3d','visibility',ui.mass?'visible':'none');
  if(ui.mass && map.getPitch()<20) map.easeTo({pitch:55,bearing:-20});
  updateMass(); if(SEL && TABS[curTab]?.[0]==='개요') renderSel();
};
$('#days').querySelectorAll('button').forEach(b=>b.onclick=()=>{ $('#days').querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); ui.day=b.dataset.d; updateShadows(); });
$('#hour').oninput=e=>{ ui.hour=+e.target.value; updateShadows(); };
updateShadows();

$('#search').onsubmit=async e=>{
  e.preventDefault(); const q=$('#q').value.trim(); if(!q) return;
  for(const category of ['parcel','road']){
    const s=await vw('req/search',{service:'search',request:'search',version:'2.0',crs:'EPSG:4326',size:1,page:1,type:'address',category,format:'json',errorformat:'json',query:q}).catch(()=>null);
    const it=s?.response?.result?.items?.[0];
    if(it){ const ll={lng:+it.point.x, lat:+it.point.y}; map.jumpTo({center:ll, zoom:17}); selectAt({lngLat:ll}); if(innerWidth<=760) $('#top').classList.add('folded'); return; }
  }
  toast('검색 결과가 없습니다');
};

function bindMapEvents(){
  map.on('click', e=>{
    const hit = map.getLayoutProperty('pts','visibility')!=='none' && map.queryRenderedFeatures(e.point,{layers:['pts']})[0];
    if(hit) return selectAt({feat:hit});
    if(map.getZoom()<14){ toast('필지를 조회하려면 더 확대하세요'); return; }
    selectAt({lngLat:e.lngLat});
  });
  map.on('mouseenter','pts',()=>map.getCanvas().style.cursor='pointer');
  map.on('mouseleave','pts',()=>map.getCanvas().style.cursor='');
  let t; map.on('moveend',()=>{ clearTimeout(t); t=setTimeout(()=>{ viewBuildings(); if(ui.shadow) updateShadows(); },250); });
}
